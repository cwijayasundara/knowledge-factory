[project]
name = "kf"
version = "0.1.0"
description = "Knowledge factory"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
kf = "kf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kf"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real LLM; excluded by default"]
addopts = "-m 'not live'"
